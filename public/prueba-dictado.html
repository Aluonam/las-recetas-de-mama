<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba del dictado</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      button {
        font-size: 1.1rem;
        padding: 0.8rem 1.4rem;
        cursor: pointer;
      }
      #registro {
        margin-top: 1.5rem;
        padding: 1rem;
        background: #f4f4f4;
        border: 1px solid #ccc;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
        min-height: 12rem;
      }
      .dato {
        background: #fff8dc;
        padding: 0.75rem 1rem;
        border: 1px solid #e0d8a0;
      }
    </style>
  </head>
  <body>
    <h1>Prueba del dictado</h1>

    <p>
      Esta página no usa nada del recetario: habla directamente con el
      navegador. Sirve para saber si el problema es de la web o del navegador.
    </p>

    <p><strong>Pulsa, di «hola qué tal» y espera diez segundos.</strong></p>

    <button id="empezar">Empezar a dictar</button>
    <button id="parar">Parar</button>

    <div class="dato" id="entorno"></div>
    <div id="registro"></div>

    <script>
      const registro = document.getElementById('registro')
      const hora = () => new Date().toISOString().slice(11, 23)
      const anotar = (texto) => {
        registro.textContent += `${hora()}  ${texto}\n`
      }

      const Motor = window.SpeechRecognition || window.webkitSpeechRecognition

      document.getElementById('entorno').textContent =
        `Navegador: ${navigator.userAgent}\n` +
        `Contexto seguro: ${window.isSecureContext}\n` +
        `Dirección: ${location.origin}\n` +
        `Reconocimiento disponible: ${Boolean(Motor)}\n` +
        `Idioma del navegador: ${navigator.language}`

      let motor = null

      document.getElementById('empezar').onclick = () => {
        if (!Motor) {
          anotar('ERROR: este navegador no tiene reconocimiento de voz.')
          return
        }

        registro.textContent = ''
        anotar('--- pulsado Empezar ---')

        motor = new Motor()
        motor.lang = 'es-ES'
        motor.continuous = true
        motor.interimResults = true

        motor.onstart = () => anotar('onstart  (el navegador dice que escucha)')
        motor.onaudiostart = () => anotar('onaudiostart  (llega audio)')
        motor.onsoundstart = () => anotar('onsoundstart  (se oye algo)')
        motor.onspeechstart = () => anotar('onspeechstart  (parece voz)')
        motor.onspeechend = () => anotar('onspeechend')
        motor.onsoundend = () => anotar('onsoundend')
        motor.onaudioend = () => anotar('onaudioend')
        motor.onnomatch = () => anotar('onnomatch  (oye pero no entiende)')

        motor.onresult = (evento) => {
          for (let i = evento.resultIndex; i < evento.results.length; i++) {
            const r = evento.results[i]
            anotar(
              `onresult  ${r.isFinal ? 'FINAL' : 'a medias'}: «${r[0].transcript}»`,
            )
          }
        }

        motor.onerror = (evento) =>
          anotar(`onerror  codigo="${evento.error}"  mensaje="${evento.message || ''}"`)

        motor.onend = () => anotar('onend  (se ha apagado)')

        try {
          motor.start()
          anotar('start() llamado sin error')
        } catch (e) {
          anotar(`start() ha lanzado: ${e.name} — ${e.message}`)
        }
      }

      document.getElementById('parar').onclick = () => {
        anotar('--- pulsado Parar ---')
        motor?.stop()
      }
    </script>
  </body>
</html>

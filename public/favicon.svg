<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gorro de cocina con corona">
  <!--
    Gorro de chef rematado en corona: la reina de la cocina.

    Se dibuja como una sola silueta y no como un gorro con una corona
    encima, porque a 16 píxeles —que es como se ve en la pestaña— dos
    objetos separados se convierten en una mancha. Aquí los picos de la
    corona SON la copa del gorro.
  -->
  <rect width="64" height="64" rx="13" fill="#2f4a35"/>

  <!-- La corona, que hace de copa del gorro -->
  <path d="M14 31 L10 16 L21 23 L32 10 L43 23 L54 16 L50 31 Z" fill="#c2a86a"/>

  <!-- Perlas en los picos -->
  <circle cx="10" cy="15" r="3" fill="#e8b4bd"/>
  <circle cx="32" cy="9" r="3.4" fill="#e8b4bd"/>
  <circle cx="54" cy="15" r="3" fill="#e8b4bd"/>

  <!-- Cuerpo del gorro -->
  <path d="M14 31 h36 v7 h-36 z" fill="#f8f2e4"/>

  <!-- La banda -->
  <rect x="12" y="38" width="40" height="14" rx="3.5" fill="#f8f2e4"/>
  <path d="M12 45 h40" stroke="#ded5c6" stroke-width="2"/>
</svg>

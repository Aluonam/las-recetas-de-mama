# Mantener despierto el proyecto de Supabase
#
# El plan gratuito pausa los proyectos que pasan unos días sin recibir
# ninguna petición. Un recetario familiar se usa a temporadas —en Navidad,
# en un cumpleaños—, así que sin esto lo normal sería encontrárselo
# dormido justo el día que hace falta.
#
# Esto hace una consulta mínima dos veces por semana. No busca engañar a
# nadie: es tráfico real y ridículo, y evita que la familia se encuentre
# la puerta cerrada.
#
# ANTES DE QUE FUNCIONE hay que crear dos secretos en GitHub:
#   Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_URL       la Project URL
#     SUPABASE_ANON_KEY  la clave anon public
#
# La clave anon es pública por diseño, pero va como secreto igualmente
# para no tenerla escrita en el repositorio.

name: Mantener despierto

on:
  schedule:
    # Lunes y jueves a las 6:15 UTC. Dos veces por semana sobra para un
    # contador de varios días, y deja margen si GitHub retrasa alguna.
    - cron: '15 6 * * 1,4'
  # Para poder lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

jobs:
  despertar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          CLAVE: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${URL:-}" ] || [ -z "${CLAVE:-}" ]; then
            echo "Faltan los secretos SUPABASE_URL o SUPABASE_ANON_KEY."
            echo "Se crean en Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Se pregunta al servicio de autenticación y no a las tablas.
          #
          # Una consulta a las recetas sin sesión devuelve 401 —«no tienes
          # permiso»—, que es justo lo que queremos que pase, pero obligaría
          # a tratar un error como éxito. Este endpoint responde 200 sin
          # depender de ningún permiso y vale igual como actividad.
          codigo=$(curl -sS -o /tmp/respuesta -w '%{http_code}' \
            "${URL}/auth/v1/health" \
            -H "apikey: ${CLAVE}")

          echo "Respuesta HTTP: ${codigo}"
          cat /tmp/respuesta
          echo

          # Lo que importa es que conteste alguien. Un 5xx o un 000 —sin
          # respuesta— son los dos casos en los que hay que preocuparse.
          if [ "${codigo}" = "000" ] || [ "${codigo}" -ge 500 ]; then
            echo "El proyecto no responde. Puede estar pausado: entra al"
            echo "panel de Supabase y reactivalo a mano esta vez."
            exit 1
          fi

          echo "Proyecto despierto."
